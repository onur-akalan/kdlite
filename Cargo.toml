[package]
name = "kdlite"
version = "0.1.0"
edition = "2021"
description = "Lightweight cloud drive client for Linux and KDE: on-demand FUSE mount, folder backup, system tray. Supports Infomaniak kDrive."
license = "MIT"
repository = "https://github.com/onur-akalan/kdlite"
readme = "README.md"
keywords = ["kdrive", "cloud-storage", "fuse", "backup", "sync"]
categories = ["filesystem", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
fuser = { version = "0.15", default-features = false }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
notify = { version = "6", default-features = false }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "0.8"

[profile.release]
opt-level = 2
debug = 1
